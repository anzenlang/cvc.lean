name: Release

# Finishes a release: attaches each platform's lean-cvc5 bundle to it, checks the release the way a
# user gets it, and only then turns the pre-release into a release.
#
# Publishing a pre-release with a new tag starts it; GitHub creates the tag. A draft would not do:
# its tag does not exist until it is published, and its files cannot be downloaded without
# authentication, so the check could not fetch the release as a user does.
#
# The bundle holds the lean-cvc5 build the release was made with and cvc5's static libraries. In a
# project depending on the release, `leanCvc5Bundle` in the lakefile restores it before Lake looks
# at lean-cvc5, which then fetches nothing; the lakefile says why. A bundle job builds lean-cvc5
# from source (`--no-cache`), so that its `ffi.o` is compiled against this release's Lean rather
# than taken from lean-cvc5's archive, which is built with lean-cvc5's own, possibly older, Lean.
# Its environment is the one lean-cvc5's own CI builds it in: the same runner images, and on Linux
# the same libc++ headers, which compiling `ffi.cpp` needs. The exception is Apple silicon, built on
# `macos-15` where lean-cvc5 names `macos-14`, an image GitHub has retired.
#
# On macOS, everything the build compiles or links would require the build machine's macOS version
# or later, while cvc5's static release and Lean itself support macOS 11. The bundle job pins that
# version and checks every object of lean-cvc5's build carries it.
#
# Nothing is cached, so a bundle holds only what this release's build made, and each check runs on
# a fresh machine, so it cannot see what the bundle job left behind. On Linux the check runs in a
# bare Ubuntu container with only what Lean and Lake need added, and no C compiler: the runner
# images come with compilers and headers, which would hide a build quietly relying on them.
#
# A failed job leaves the pre-release as it is. Delete it along with its tag and publish it again,
# or publish the next version. Windows is not built yet: the library builds there under MSYS2, as
# lean-cvc5 does, but a lean-cvc5 bug breaks its abstract sorts on Windows.

on:
  release:
    types: [prereleased]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}

env:
  TAG: ${{ github.event.release.tag_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      # the same platforms in `check-linux` and `check-macos`
      matrix:
        include:
          - { name: Linux-x86_64, os: ubuntu-22.04 }
          - { name: Linux-aarch64, os: ubuntu-22.04-arm }
          - { name: macOS-aarch64, os: macos-15 }
          - { name: macOS-x86_64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # the oldest macOS cvc5's static release and Lean itself support, which compilers default to
      # the build machine's instead; only compilers targeting macOS read it
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install lean-cvc5's build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang-15 lld-15 libc++-15-dev libc++abi-15-dev
      - name: Install Lean
        run: .github/scripts/install_lean.sh
      - name: Build, lean-cvc5 from source
        run: lake build --no-cache
      - name: Check the bundle's minimum macOS version
        if: runner.os == 'macOS'
        run: |
          found=0
          while IFS= read -r -d '' file; do
            found=1
            minos=$(otool -l "$file" |
              awk '/LC_BUILD_VERSION/ { b = 1 } b && /minos/ && !m { m = $2 } END { print m }')
            echo "$file: macOS $minos"
            if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::$file requires macOS $minos, not $MACOSX_DEPLOYMENT_TARGET"
              exit 1
            fi
          done < <(find .lake/packages/cvc5/.lake/build -type f \
            \( -name '*.o' -o -name '*.o.export' -o -name '*.dylib' \) -print0)
          [ "$found" = 1 ] || { echo "::error::no object found in lean-cvc5's build"; exit 1; }
      # works around tar packing corrupt archives on macOS runners,
      # https://github.com/actions/runner-images/issues/2619
      - name: Purge the disk cache
        if: runner.os == 'macOS'
        run: sudo /usr/sbin/purge
      - name: Pack the lean-cvc5 bundle
        run: lake run packLeanCvc5Bundle "$RUNNER_TEMP/bundle"
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/bundle/*.tar.gz --clobber

  # `check-linux` and `check-macos` check the platforms `bundle` builds, as a user gets the release
  check-linux:
    name: check (${{ matrix.name }})
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux-x86_64, os: ubuntu-22.04 }
          - { name: Linux-aarch64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    # a bare system rather than the runner's, which comes with compilers, headers and tools that a
    # user's machine may not have
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Install what Lean and Lake need
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git
          # nothing to compile with but what Lean ships, as on a machine with no C compiler
          for tool in cc c++ gcc g++ clang; do
            if command -v "$tool"; then
              echo "::error::the container has \`$tool\`"
              exit 1
            fi
          done
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Lean
        run: .github/scripts/install_lean.sh
      - name: Build a project requiring the release
        run: .github/scripts/check_release.sh "https://github.com/$GH_REPO" "$TAG"

  check-macos:
    name: check (${{ matrix.name }})
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-aarch64, os: macos-15 }
          - { name: macOS-x86_64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Lean
        run: .github/scripts/install_lean.sh
      - name: Build a project requiring the release
        run: .github/scripts/check_release.sh "https://github.com/$GH_REPO" "$TAG"

  publish:
    needs: [check-linux, check-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Turn the pre-release into a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --prerelease=false --latest
