name: CI

# Builds and tests the library and builds the manual, on pull requests to `main` and pushes to it.
# On `main` it also builds the API reference and publishes both on GitHub Pages — after the tests
# and the manual pass, and reusing the manual built here.
#
# There is no `lake update`: the build follows the committed `lake-manifest.json`, and lean-cvc5
# fetches its precompiled cvc5 as a build target.
#
# Caches. `build` saves the Lake directory per commit and `test` restores it, so that the tests do
# not rebuild the library. `manual` and `api-docs` keep caches of their own, because the manual and
# the API reference share the root's packages directory and so need Verso or doc-gen4 in it, which
# `build`'s does not have. Those two are saved only from `main` — they are large, and GitHub keeps
# 10 GB per repository — and restored everywhere: a pull request falls back on `main`'s newest. A
# key that misses always falls back on the newest cache for the same toolchain and manifests, so a
# first run on a commit rebuilds only what changed.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run it supersedes, on `main` too: that run would only deploy stale pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check that the projects agree on versions
        run: python3 .github/scripts/check_versions.py lake-manifest.json CvcManual/lake-manifest.json
      - name: Cache the Lake directory
        uses: actions/cache@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Build
        run: lake build

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Restore the Lake directory
        uses: actions/cache/restore@v6
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Test
        run: lake test

  # the manual compiles its examples and checks their output, so a change breaking one fails here
  manual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Restore the Lake directories
        uses: actions/cache/restore@v6
        with:
          path: |
            .lake
            CvcManual/.lake
          key: manual-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'CvcManual/lean-toolchain', 'CvcManual/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: manual-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'CvcManual/lean-toolchain', 'CvcManual/lake-manifest.json') }}-
      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Build the manual
        run: lake run buildManual
      - name: Save the Lake directories
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: |
            .lake
            CvcManual/.lake
          key: manual-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'CvcManual/lean-toolchain', 'CvcManual/lake-manifest.json') }}-${{ github.sha }}
      - name: Hand the manual over to the deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: manual
          path: CvcManual/_out/html-multi
          retention-days: 1

  api-docs:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The project is generated under `.lake`, so that one path covers it — except its build
      # directory: doc-gen4 never drops the pages of a module that no longer exists, so the reference
      # is regenerated from scratch rather than published with stale pages in it.
      - name: Restore the Lake directory
        uses: actions/cache/restore@v6
        with:
          path: |
            .lake
            !.lake/docbuild/.lake/build
          key: docs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: docs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Build the API reference
        run: lake run buildApiDocs
      # the generated project's manifest only exists now
      - name: Check that the projects agree on versions
        run: >-
          python3 .github/scripts/check_versions.py
          lake-manifest.json CvcManual/lake-manifest.json .lake/docbuild/lake-manifest.json
      - name: Save the Lake directory
        uses: actions/cache/save@v6
        with:
          path: |
            .lake
            !.lake/docbuild/.lake/build
          key: docs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Hand the reference over to the deployment
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: .lake/docbuild/.lake/build/doc
          retention-days: 1

  # Publishes `api/` and `manual/`, with the README as the site's front page. There is no branch:
  # the site is uploaded as an artifact and deployed by GitHub Pages, whose source must be set to
  # "GitHub Actions", and each deployment replaces the whole site.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, manual, api-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fetch the manual
        uses: actions/download-artifact@v8
        with:
          name: manual
          path: _site/manual
      - name: Fetch the API reference
        uses: actions/download-artifact@v8
        with:
          name: api-docs
          path: _site/api
      - name: Render the README as the front page
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/render_readme.sh README.md _site/index.html
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
