name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Lean Environment
      uses: leanprover/lean-action@v1
      with:
        auto-config: false
        use-github-cache: false
    - name: Update
      run: lake update
    - name: Build
      run: lake build
    - name: Test
      run: lake test
