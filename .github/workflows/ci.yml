name: CI

# Builds and tests the library and builds the manual, on pull requests to `main` and pushes to it.
# The site — the manual, the API reference and the front page — is published by the release
# workflow, for the latest release only, so that it documents what users depend on.
#
# One job does it all, in sequence, on one machine: the manual builds on the library `lake build`
# just built, sharing its `.lake/packages`, so a single Lake directory grows step by step.
#
# There is no `lake update`: the build follows the committed `lake-manifest.json`, and lean-cvc5
# fetches its precompiled cvc5 as a build target.
#
# Caches:
# - `~/.elan`, keyed on the exact toolchain and nothing else, so that a Lean bump starts from an
#   empty directory and saves an entry holding only the new toolchain; the old entry is never
#   restored again and GitHub drops it after a week unused;
# - the Lake directories, saved only from `main` — the entry holds the library and Verso, and GitHub
#   keeps 10 GB per repository — and restored everywhere: a pull request starts from `main`'s newest
#   and rebuilds only what changed.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run it supersedes, on `main` too.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # whether this run saves the cache: a push to `main`, or a manual run on it
      ON_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check that the projects agree on versions
        run: python3 .github/scripts/check_versions.py lake-manifest.json CvcManual/lake-manifest.json

      - name: Restore Lean
        id: restore-lean
        uses: actions/cache/restore@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'CvcManual/lean-toolchain') }}
      - name: Install Lean
        run: .github/scripts/install_lean.sh
      - name: Save Lean
        if: steps.restore-lean.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'CvcManual/lean-toolchain') }}

      - name: Restore the Lake directories
        uses: actions/cache/restore@v6
        with:
          path: |
            .lake
            CvcManual/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'CvcManual/lean-toolchain', 'CvcManual/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'CvcManual/lean-toolchain', 'CvcManual/lake-manifest.json') }}-

      - name: Build
        run: lake build
      - name: Test
        run: lake test
      # the manual compiles its examples and checks their output, so breaking one fails here
      - name: Build the manual
        run: lake run buildManual

      - name: Save the Lake directories
        if: env.ON_MAIN == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .lake
            CvcManual/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'CvcManual/lean-toolchain', 'CvcManual/lake-manifest.json') }}-${{ github.sha }}
